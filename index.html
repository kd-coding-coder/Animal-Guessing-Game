<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Animal Guessing</title>

        <style>
            body{
                background-color: rgb(237, 250, 244);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                padding: 20px;
            }

            .container{
                max-width: 600px;
                margin-top: 50px;
                padding: 20px;
                background-color: rgb(225, 249, 237);
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(rgb(202, 255, 202));
            }

            h2{
                text-align: center;
                color: rgb(20, 59, 24);
            }

            .alert{
                text-align: center;
                font-size: 1.2rem;
            }

            .image-container{
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
                margin-top: 20px;
            }

            .image-container img{
                width: 120px;
                height: 120px;
                cursor: pointer;
                border-radius: 8px;
                margin-bottom: 10px;
                transition: transform 0.3s;
            }

            .image-container img:hover{
                transform: scale(1.1);
            }

            .btn{
                width: 100%;
            }

            #playAgainBtn{
                display: none;
                margin-top: 20px;
            }

            #startGameBtn{
                display: block;
                margin-top: 20px;
            }

            .btn-container{
                text-align: center;
            }
        </style>
    </head>

    <body>
     <div class="container">
        <h2>Animal Guessing Game</h2>
        <p>Click on the correct animal to match the computer's secret choice.</p>

        <div id="result"></div>

        <div class="image-container">
            <img src="dog.avif" alt="dog" id="dog" onclick="checkGuess('dog')">
            <img src="dolphin.webp" alt="dolphin" id="dolphin" onclick="checkGuess('dolphin')">
            <img src="giraffe.webp" alt="giraffe" id="giraffe" onclick="checkGuess('giraffe')">
            <img src="koala.webp" alt="koala" id="koala" onclick="checkGuess('koala')">
            <img src="rabbit.jpg" alt="rabbit" id="rabbit" onclick="checkGuess('rabbit')">
        </div>

        <div class="btn-container">
         <button class="btn btn-secondary" id="playAgainBtn" onclick="resetGame()">Try Again</button>
         <button class="btn btn-primary" id="startGameBtn" onclick="startGame()">Start Game</button>
        </div>
     </div>


    </body>
</html>
